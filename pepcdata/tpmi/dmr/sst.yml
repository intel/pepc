    SST_PP_CONTROL:
        offset: 120
        width: 64
        fields:
            SST_PP_LEVEL:
                bits: "2:0"
                readonly: false
                desc: >-
                    A SST-PP level that SW intends to switch to. SW must program PP level setting to
                    each SST instance per their instance-ID order. I.e. program instance 0 first,
                    and follow by 1, 2, 3, etc. SW must check status and confirm PP switching is
                    complete before proceeding to next SST instance
            SST_PP_LOCK:
                bits: "3:3"
                readonly: false
                desc: >-
                    SST-PP level select lock. 0 - unlocked. 1 - locked till next reset
            RSVD0:
                bits: "7:4"
                readonly: false
                desc: >-
                    Reserved
            FEATURE_STATE:
                bits: "15:8"
                readonly: false
                desc: >-
                    Bit mask to control the enable(1)/disable(0) state of each feature of the
                    current PP level. bit 0 = BF, bit 1 = TF, bit 2-7 = reserved
            RSVD1:
                bits: "63:16"
                readonly: false
                desc: >-
                    Reserved
    SST_PP_STATUS:
        offset: 128
        width: 64
        fields:
            SST_PP_LEVEL:
                bits: "2:0"
                readonly: true
                desc: >-
                    Returns the current SST-PP level
            SST_PP_LOCK:
                bits: "3:3"
                readonly: true
                desc: >-
                    Returns the lock bit setting in SST_CONTROL.SST_PP_LOCK
            SST_PP_ERROR_TYPE:
                bits: "7:4"
                readonly: true
                desc: >-
                    Returns last error of SST-PP control. 0x0: no error 0x1: dynamic PP switch is
                    not allowed. 0x2..0xF: reserved
            FEATURE_STATE:
                bits: "15:8"
                readonly: true
                desc: >-
                    Bit mask to indicate the enable(1)/disable(0) state of each feature of the
                    current PP level. bit 0 = BF, bit 1 = TF, bit 2-7 = reserved
            RSVD0:
                bits: "31:16"
                readonly: true
                desc: >-
                    Reserved
            FEATURE_ERROR_TYPE:
                bits: "55:32"
                readonly: true
                desc: >-
                    Returns last error of the specific feature. Three error_type bits per feature.
                    i.e. ERROR_TYPE[2:0] for BF, ERROR_TYPE[5:3] for TF, etc. 0x0: no error 0x1: The
                    specific feature is not supported by the hardware. 0x2-0x6: Reserved 0x7:
                    feature state change is not allowed
            RSVD1:
                bits: "63:56"
                readonly: true
                desc: >-
                    Reserved
    SST_PP_MISC_CONTROL:
        offset: 136
        width: 64
        fields:
            MODULE_TURBO_CONTROL:
                bits: "0:0"
                readonly: false
                desc: >-
                    Module Turbo allows you to run the Core at a higher frequency when only one
                    active core is running per module (or when there are fewer active cores than all
                    active cores in the module). This bit controls Module Turbo capability. 1'b0:
                    Disable module turbo. A Core is NOT allowed to run at a higher turbo frequency
                    when some of the Cores in a module are not active. 1'b1: Enable module turbo. A
                    Core is allowed to run at a higher turbo frequency when some of the Cores in a
                    module are not active
            RSVD:
                bits: "63:1"
                readonly: false
                desc: >-
                    Reserved
    SST_PP_MISC_STATUS:
        offset: 144
        width: 64
        fields:
            MODULE_TURBO_CAPABILITY:
                bits: "0:0"
                readonly: true
                desc: >-
                    Module Turbo allows you to run the Core at a higher frequency when only one
                    active core is running per module (or when there are fewer active cores than all
                    active cores in the module). This bit specifies whether this part supports
                    Module Turbo capability. 1'b0: Module Turbo is not supported on this part 1'b1:
                    Module Turbo is supported on this part
            MODULE_TURBO_STATUS:
                bits: "1:1"
                readonly: true
                desc: >-
                    1'b0: Module Turbo is not activated 1'b1: Module Turbo is activated If
                    MODULE_TURBO_CAPABILITY=0, SW write to SST_PP_MISC_CONTROL.MODULE_TURBO_CONTROL
                    are ignored
            RSVD:
                bits: "63:2"
                readonly: true
                desc: >-
                    Reserved
    SST_PP_INFO_0:
        offset: 152
        width: 64
        fields:
            P1_SSE:
                bits: "7:0"
                readonly: true
                desc: >-
                    Base frequency ratio of the TDP workload, a.k.a. SSE P1
            P1_AVX2:
                bits: "15:8"
                readonly: true
                desc: >-
                    P1 frequency ratio of the AVX2 representative workload
            P1_AVX512:
                bits: "23:16"
                readonly: true
                desc: >-
                    P1 frequency ratio of the AVX512 representative workload
            P1_AMX:
                bits: "31:24"
                readonly: true
                desc: >-
                    P1 frequency ratio of the AMX representative workload
            RSVD:
                bits: "63:32"
                readonly: true
                desc: >-
                    Reserved
    SST_PP_INFO_1:
