name: "rit"
desc: >-
    Resource Isolation Technology
feature_id: 0x8

registers:
    RIT_HEADER:
        offset: 0
        width: 64
        fields:
            INTERFACE_VERSION:
                bits: "7:0"
                readonly: true
                desc: >-
                    Version number for this interface. Bit[7:5] denotes Major Version and bit[4:0]
                    for Minor Version
            RIT_CAPABILITY_MASK:
                bits: "11:8"
                readonly: true
                desc: >-
                    0001 : Support Frequency Isolation technology. All others: Reserved
            NUM_FIT_CONFIGS:
                bits: "13:12"
                readonly: true
                desc: >-
                    Indicate how many FIT_CONFIG_x registers are valid
            RATIO_UNIT:
                bits: "15:14"
                readonly: true
                desc: >-
                    Core frequency ratio unit. 00: 100MHz. All others : Reserved. Default=0
            RSVD:
                bits: "63:16"
                readonly: true
                desc: >-
                    Reserved
    FIT_INFO_0:
        offset: 8
        width: 64
        fields:
            TRL_LEVEL_0:
                bits: "7:0"
                readonly: true
                desc: >-
                    All core turbo frequency of TRL level 0 of the current SSTPP level
            TRL_LEVEL_1:
                bits: "15:8"
                readonly: true
                desc: >-
                    All core turbo frequency of TRL level 1 of the current SSTPP level
            TRL_LEVEL_2:
                bits: "23:16"
                readonly: true
                desc: >-
                    All core turbo frequency of TRL level 2 of the current SSTPP level
            TRL_LEVEL_3:
                bits: "31:24"
                readonly: true
                desc: >-
                    All core turbo frequency of TRL level 3 of the current SSTPP level
            TRL_LEVEL_4:
                bits: "39:32"
                readonly: true
                desc: >-
                    All core turbo frequency of TRL level 4 of the current SSTPP level
            TRL_LEVEL_5:
                bits: "47:40"
                readonly: true
                desc: >-
                    All core turbo frequency of TRL level 5 of the current SSTPP level
            RSVD:
                bits: "63:48"
                readonly: true
                desc: >-
                    Reserved
    FIT_CONFIG_0:
        offset: 16
        width: 64
        fields:
            FIT_MODULE0:
                bits: "3:0"
                readonly: false
                desc: >-
                    Frequency Variability Tolerance for Module 0. SW specifies number of frequency
                    bins of frequency Variability that it can tolerate relative to SSE P0n (All core
                    turbo frequency) for the given SLA. The unit of frequency bins is specified in
                    RATIO_UNIT of FIT_HEADER. E.g. 0x0: Frequency fixed to SSE P0n. 0xF: Legacy Mode
            FIT_MODULE1:
                bits: "7:4"
                readonly: false
                desc: >-
